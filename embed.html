<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario Archive — Stockholm Scenario Festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yrsa:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archive.css">
<style>
  html, body { background: #fff; overflow: hidden; }  /* the parent page resizes the iframe, so no inner scrollbar */
</style>
</head>
<body>
<div id="embed-wrap">
  <div class="controls" role="search">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search" aria-label="Search scenarios" placeholder="Search by title, author or theme…" autocomplete="off" spellcheck="false">
    </div>
    <div class="filter-row">
      <span class="filter-lbl">Filter:</span>
      <select id="filter-year" aria-label="Year"><option value="">All years</option></select>
      <select id="filter-duration" aria-label="Duration"><option value="">Any duration</option></select>
      <select id="filter-players" aria-label="Number of players"><option value="">Any players</option></select>
      <select id="filter-format" aria-label="Format"><option value="">Any format</option></select>
      <label class="dl-check"><input type="checkbox" id="filter-download"> Download available</label>
      <button type="button" class="clear-btn" id="clear">Clear all</button>
    </div>
  </div>

  <div class="results-bar">
    <span class="results-count" aria-live="polite">Showing <strong id="result-count">—</strong> of <strong id="total-count">—</strong> scenarios</span>
    <label class="sort-wrap">Sort:
      <select id="sort">
        <option value="year-desc">Newest first</option>
        <option value="year-asc">Oldest first</option>
        <option value="title">Title A–Z</option>
      </select>
    </label>
  </div>

  <div class="grid" id="grid"><div class="message"><p>Loading…</p></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
