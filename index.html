<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario Archive — Stockholm Scenario Festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yrsa:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archive.css">
<style>
body {
  min-height: 100vh;
  background: #bbb url('https://stockholmscenariofestival.files.wordpress.com/2013/05/pattern2_scf3.jpg') repeat;
}
.site-wrap { max-width: 1040px; margin: 0 auto; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,.15); }
/* ── HEADER ──────────────────────────────────────────────────── */
.site-header {
  background: var(--white);
  text-align: center;
  padding: 2.2rem 1rem 1.5rem;
}

/* Feather logo — tall narrow PNG, 55×206px natural size */
.site-header .logo-wrap {
  display: block;
  text-decoration: none;
  margin-bottom: 0.9rem;
}
.site-header .logo-wrap img {
  height: 120px;
  width: auto;
  display: inline-block;
}

/* Site title uses Yrsa — exact font from live site */
.site-header .site-title {
  font-family: 'Yrsa', Georgia, serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin-bottom: 0.3rem;
}
.site-header .site-tagline {
  font-family: 'Yrsa', Georgia, serif;
  font-size: 0.95rem;
  color: var(--text3);
  letter-spacing: 0.02em;
  margin-bottom: 1rem;
}

/* Social buttons — teal circles matching live site */
.social-links {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
}
.social-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  background: var(--teal);
  border-radius: 50%;
  color: #fff;
  text-decoration: none;
  transition: opacity 0.15s;
}
.social-btn:hover { opacity: 0.7; } /* matches site's hover: opacity 0.5 */
.social-btn svg { width: 16px; height: 16px; fill: #fff; flex-shrink: 0; }

/* ── NAV — exact match ───────────────────────────────────────── */
.site-nav {
  background: var(--teal); /* rgb(21, 182, 184) */
}
.site-nav ul {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin: 0;
  padding: 0;
}
.site-nav li { display: flex; align-items: center; }
.site-nav a {
  display: block;
  padding: 0.8rem 1.1rem;
  color: #fff;
  text-decoration: none;
  font-family: 'Source Sans 3', 'Source Sans Pro', Helvetica, sans-serif;
  font-size: 15px;         /* exact from live site */
  font-weight: 700;
  letter-spacing: 1px;     /* exact from live site */
  text-transform: uppercase;
  transition: opacity 0.15s;
}
.site-nav a:hover, .site-nav a.active { opacity: 0.6; }
.nav-dot {
  color: rgba(255,255,255,0.5);
  font-size: 0.5rem;
  padding: 0 0.1rem;
}

/* ── PAGE CONTENT ────────────────────────────────────────────── */
.page-content {
  max-width: var(--max);
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* ── PAGE HEADING ────────────────────────────────────────────── */
.page-heading {
  padding-bottom: 1rem;
  margin-bottom: 1.4rem;
  border-bottom: 2px solid var(--teal);
}
.page-heading h1 {
  font-family: 'Yrsa', Georgia, serif;
  font-size: clamp(1.5rem, 3.5vw, 2rem);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 0.2rem;
}
.page-heading p { font-size: 0.88rem; color: var(--text3); }
.page-heading p strong { color: var(--text2); }


.page-content { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.page-heading { padding-bottom: 1rem; margin-bottom: 1.4rem; border-bottom: 2px solid var(--teal); }
.page-heading h1 { font-family: var(--serif); font-size: clamp(1.5rem, 3.5vw, 2rem); color: var(--text); }
.page-heading p { font-size: .9rem; color: var(--text3); }
.site-footer { background: var(--teal-dark); color: #fff; text-align: center; padding: 1.5rem; font-size: .85rem; }
.site-footer a { color: #fff; }
@media (max-width: 580px) {
  .page-content { padding: 1.2rem 1rem 3rem; }
  .site-header .logo-wrap img { height: 80px; }
  .site-nav a { padding: .65rem .65rem; font-size: .72rem; }
}
</style>
</head>
<body>
<div class="site-wrap">
<header class="site-header">
  <a href="https://scenariofestival.se" class="logo-wrap">
    <!-- Exact feather logo from live site: 55×206px natural, shown at 120px tall -->
    <img
      src="https://scenariofestival.se/wp-content/uploads/2014/04/cropped-cropped-cropped-cropped-header-webb_1040_nodate2.png"
      alt="Stockholm Scenario Festival"
    >
  </a>
  <div class="site-title">Stockholm Scenario Festival</div>
  <div class="site-tagline"></div>
  <div class="social-links">
    <a class="social-btn" href="https://www.facebook.com/StockholmScenarioFestival/" target="_blank" rel="noopener" title="Facebook">
      <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
    </a>
    <a class="social-btn" href="mailto:info@scenariofestival.se" title="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2" fill="#fff" fill-opacity="0"/><polyline points="2,4 12,13 22,4"/></svg>
    </a>
    <a class="social-btn" href="https://www.instagram.com/explore/tags/stockholmscenariofestival/" target="_blank" rel="noopener" title="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="#fff"/></svg>
    </a>
  </div>
</header>

<!-- NAV — simplified: just back-link to main site -->
<nav class="site-nav">
  <ul>
    <li><a href="https://scenariofestival.se/">Home</a></li>
    <li class="nav-dot" aria-hidden="true">·</li>
    <li><a href="https://scenariofestival.se/archive/">Archive</a></li>
  </ul>
</nav>

<main class="page-content" id="embed-wrap">
  <div class="page-heading">
    <h1>Scenario Archive</h1>
    <p>Search and filter scenarios from <span data-year-range></span></p>
  </div>
  <div class="controls" role="search">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search" aria-label="Search scenarios" placeholder="Search by title, author or theme…" autocomplete="off" spellcheck="false">
    </div>
    <div class="filter-row">
      <span class="filter-lbl">Filter:</span>
      <select id="filter-year" aria-label="Year"><option value="">All years</option></select>
      <select id="filter-duration" aria-label="Duration"><option value="">Any duration</option></select>
      <select id="filter-players" aria-label="Number of players"><option value="">Any players</option></select>
      <select id="filter-format" aria-label="Format"><option value="">Any format</option></select>
      <label class="dl-check"><input type="checkbox" id="filter-download"> Download available</label>
      <button type="button" class="clear-btn" id="clear">Clear all</button>
    </div>
  </div>

  <div class="results-bar">
    <span class="results-count" aria-live="polite">Showing <strong id="result-count">—</strong> of <strong id="total-count">—</strong> scenarios</span>
    <label class="sort-wrap">Sort:
      <select id="sort">
        <option value="year-desc">Newest first</option>
        <option value="year-asc">Oldest first</option>
        <option value="title">Title A–Z</option>
      </select>
    </label>
  </div>

  <div class="grid" id="grid"><div class="message"><p>Loading…</p></div></div>

</main>
<footer class="site-footer">
  <a href="https://scenariofestival.se">Stockholm Scenario Festival</a>
</footer>
</div>
<script src="app.js"></script>
</body>
</html>
